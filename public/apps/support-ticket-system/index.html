<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Support Ticket System</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Portfolio project 2</p>
          <h1>Support Ticket System</h1>
        </div>
        <button class="primary-action" form="ticket-form" type="submit">Create ticket</button>
      </header>

      <section class="stat-grid" id="stats" aria-label="Ticket summary"></section>

      <section class="workspace" aria-label="Ticket workspace">
        <section class="panel list-panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Queue</p>
              <h2>Tickets</h2>
            </div>
            <label class="search-field">
              <span>Search</span>
              <input id="ticket-search" type="search" placeholder="Requester, title, notes" />
            </label>
          </div>

          <div class="filter-row">
            <div class="segmented-controls" id="status-filters" aria-label="Filter by status"></div>
            <div class="segmented-controls" id="priority-filters" aria-label="Filter by priority"></div>
          </div>

          <div class="table-wrap" id="ticket-list"></div>
        </section>

        <aside class="panel form-panel" aria-label="Create ticket">
          <div>
            <p class="eyebrow">New request</p>
            <h2>Create Ticket</h2>
          </div>

          <form id="ticket-form" novalidate>
            <label>
              <span>Title</span>
              <input name="title" required placeholder="Customer cannot reset password" />
            </label>

            <label>
              <span>Requester</span>
              <input name="requester" required placeholder="Avery Johnson" />
            </label>

            <label>
              <span>Assignee</span>
              <input name="assignee" placeholder="Unassigned" />
            </label>

            <div class="field-row">
              <label>
                <span>Status</span>
                <select name="status" id="status-select" required></select>
              </label>

              <label>
                <span>Priority</span>
                <select name="priority" id="priority-select" required></select>
              </label>
            </div>

            <div class="field-row">
              <label>
                <span>Channel</span>
                <select name="channel" id="channel-select">
                  <option>Email</option>
                  <option>Chat</option>
                  <option>Phone</option>
                  <option>Portal</option>
                </select>
              </label>

              <label>
                <span>Customer Tier</span>
                <select name="customerTier">
                  <option>Standard</option>
                  <option>Growth</option>
                  <option>Enterprise</option>
                </select>
              </label>
            </div>

            <label>
              <span>Internal Note</span>
              <textarea name="note" rows="5" placeholder="Add triage context or reproduction steps"></textarea>
            </label>

            <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
          </form>
        </aside>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
